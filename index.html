<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enhanced Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <button id="darkModeBtn">🌙 Dark Mode</button>

    <main>
        <header>
            <div>
                <h5>Total Balance</h5>
                <span id="balance">$0.00</span>
            </div>

            <div>
                <h5>Income</h5>
                <span id="income">$0.00</span>
            </div>

            <div>
                <h5>Expense</h5>
                <span id="expense">$0.00</span>
            </div>
        </header>

        <section>
            <h3>Transactions</h3>

            <input
                type="text"
                id="search"
                placeholder="🔍 Search Transaction..."
            />

            <ul id="transactionList" data-placeholder="No transactions."></ul>
        </section>

        <section>
            <h3>Add Transaction</h3>

            <form id="transactionForm">

                <div>
                    <label for="type">
                        <input type="checkbox" name="type" id="type" checked />
                        <div class="option" data-option="Income">
                            <span>Expense</span>
                        </div>
                    </label>
                </div>

                <div>
                    <label for="name">Transaction Name</label>
                    <input
                        type="text"
                        name="name"
                        id="name"
                        required
                    />
                </div>

                <div>
                    <label for="amount">Amount</label>
                    <input
                        type="number"
                        name="amount"
                        id="amount"
                        value="0"
                        min="0"
                        step="any"
                        required
                    />
                </div>

                <div>
                    <label for="date">Date</label>
                    <input
                        type="date"
                        name="date"
                        id="date"
                        required
                    />
                </div>

                <!-- NEW FEATURE 1 -->
                <div>
                    <label for="category">Category</label>
                    <select id="category">
                        <option>Food</option>
                        <option>Travel</option>
                        <option>Shopping</option>
                        <option>Education</option>
                        <option>Medical</option>
                        <option>Entertainment</option>
                        <option>Other</option>
                    </select>
                </div>

                <!-- NEW FEATURE 2 -->
                <div>
                    <label for="payment">Payment Method</label>
                    <select id="payment">
                        <option>Cash</option>
                        <option>UPI</option>
                        <option>Credit Card</option>
                        <option>Debit Card</option>
                        <option>Net Banking</option>
                    </select>
                </div>

                <!-- NEW FEATURE 3 -->
                <div>
                    <label for="budget">Monthly Budget</label>
                    <input
                        type="number"
                        id="budget"
                        placeholder="Enter Monthly Budget"
                    />
                </div>

                <!-- NEW FEATURE 4 -->
                <div>
                    <label for="notes">Notes</label>
                    <textarea
                        id="notes"
                        rows="3"
                        placeholder="Enter notes here..."
                    ></textarea>
                </div>

                <!-- NEW FEATURE 5 -->
                <div>
                   <button type="button" id="pdfBtn">
    Download PDF Report
</button>
                </div>

                <button type="submit">Submit</button>

            </form>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>
</html>
